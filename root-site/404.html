<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>الصفحة غير موجودة | Page not found</title>
    <script>
        // Paths are case-sensitive on GitHub Pages: /cv, /Cv/… go to the portfolio at /CV/ instead of a 404
        (function () {
            var m = /^\/cv(\/.*)?$/i.exec(location.pathname);
            if (m && location.pathname.indexOf('/CV/') !== 0) location.replace('/CV' + (m[1] || '/') + location.search + location.hash);
        })();
    </script>
    <style>body { font-family: system-ui, sans-serif; text-align: center; margin-top: 20vh; color: #1f2937; } a { color: #2563eb; font-weight: 700; }</style>
</head>
<body>
    <h1>الصفحة غير موجودة — Page not found</h1>
    <p><a href="https://osamaal-harbi.github.io/CV/">الذهاب إلى الموقع — Go to the portfolio</a></p>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>غير متصل | Offline</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: Tajawal, Roboto, system-ui, sans-serif; text-align: center; padding: 24px;
            background: #f9fafb; color: #1f2937;
        }
        @media (prefers-color-scheme: dark) { body { background: #0b1120; color: #f3f4f6; } }
        .icon { font-size: 56px; margin-bottom: 16px; }
        h1 { font-size: 24px; margin: 0 0 8px; }
        p { margin: 0 0 4px; color: #6b7280; }
        a {
            display: inline-block; margin-top: 24px; padding: 12px 28px; border-radius: 12px;
            background: #2563eb; color: #fff; font-weight: 700; text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <div class="icon" aria-hidden="true">📡</div>
        <h1>أنت غير متصل بالإنترنت</h1>
        <p>تحقق من اتصالك ثم أعد المحاولة.</p>
        <p lang="en" dir="ltr">You are offline. Check your connection and try again.</p>
        <a href="./">إعادة المحاولة / Retry</a>
    </main>
</body>
</html>

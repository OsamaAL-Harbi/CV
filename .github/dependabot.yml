# Weekly update PRs for the build/test tools (npm devDependencies) and the GitHub Actions the workflows use.
# Actions are pinned to commit SHAs in the workflows; Dependabot keeps those pins (and their "# vN" comments) current.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5
    # Major versions change APIs and config formats (Tailwind 4, Font Awesome 7 broke the build in #22):
    # those are upgraded by hand, with the code changes they need, not in the weekly group
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      dev-tools:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
    groups:
      actions:
        patterns: ['*']

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04          # Playwright 1.56 has no browser build for ubuntu-latest (26.04) yet
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # npm ci runs install scripts: no token left in .git/config

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Committed CSS, fonts and vendor files match the sources
        run: |
          npm run build:css
          git diff --exit-code -- assets/css assets/fonts assets/vendor assets/img/qr-site.svg

      - name: Unit tests (deploy-time data scripts)
        run: npm run test:unit

      - name: CDN files are pinned and match their SRI hashes
        run: npm run check:sri

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        run: npm test

      - name: Lighthouse CI (mobile, median of 3 runs, every category >= 90)
        run: npx lhci autorun

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            playwright-report/
            lhci-reports/
          retention-days: 14
          if-no-files-found: ignore

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false   # npm ci runs install scripts: no token left in .git/config

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Committed CSS, fonts and vendor files match the sources
        run: |
          npm run build:css
          git diff --exit-code -- assets/css assets/fonts assets/vendor assets/img/qr-site.svg

      - name: Unit tests (deploy-time data scripts)
        run: npm run test:unit

      - name: CDN files are pinned and match their SRI hashes
        run: npm run check:sri

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        run: npm test

      - name: Lighthouse CI (mobile, median of 3 runs, every category >= 90)
        run: npx lhci autorun

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-reports
          path: |
            playwright-report/
            lhci-reports/
          retention-days: 14
          if-no-files-found: ignore

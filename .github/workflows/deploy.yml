name: Deploy site

# Publishes the site to GitHub Pages with fresh GitHub data (generated/github.json) and system status
# (generated/status.json). Requires Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3,15 * * *'      # every 12 hours (03:23 and 15:23 UTC)
  workflow_dispatch:

# Each job gets only what it needs (see the jobs below)
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write      # e-mail alerts: an issue that mentions the owner when a monitored site is down
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      # Both steps fall back to the copy already on the site, so an API hiccup never breaks the deploy.
      - name: GitHub data (repositories, contributions, activity, READMEs)
        run: node scripts/fetch-github.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: System status (monitored sites)
        run: node scripts/check-status.mjs

      - name: E-mail alerts for sites that went down or came back
        run: node scripts/alert-status.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the published files
        run: node scripts/assemble-site.mjs _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
